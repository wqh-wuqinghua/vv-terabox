name: record

on:
  workflow_dispatch:        # 手动触发
  schedule:
    # 北京时间 08:30 = UTC 00:30；14:30 = UTC 06:30
    - cron: "0 23 * * *"
    

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 最长录制 6 小时

    steps:
      - name: Show time
        run: date -u && date
        
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Tailscale
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
        run: |
          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # Get OAuth access token
          echo "Getting OAuth access token..."
          ACCESS_TOKEN=$(curl -s -X POST "https://api.tailscale.com/api/v2/oauth/token" \
            -u "${TS_OAUTH_CLIENT_ID}:${TS_OAUTH_SECRET}" \
            -d "grant_type=client_credentials" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to get access token"
            exit 1
          fi
          echo "Got access token"

          # Create ephemeral auth key
          echo "Creating ephemeral auth key..."
          KEY_RESPONSE=$(curl -s -X POST "https://api.tailscale.com/api/v2/tailnet/-/keys" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"tags":["tag:github-actions"]}}}}')

          echo "API Response: $KEY_RESPONSE"
          AUTH_KEY=$(echo "$KEY_RESPONSE" | jq -r '.key')

          if [ -z "$AUTH_KEY" ] || [ "$AUTH_KEY" = "null" ]; then
            echo "Failed to create auth key"
            echo "Check: 1) OAuth client has 'devices:write' permission"
            echo "       2) ACL has 'tag:github-actions' in tagOwners"
            exit 1
          fi
          echo "Created auth key"

          # Start Tailscale
          sudo tailscale up --authkey="$AUTH_KEY" --hostname=github-recorder --accept-routes

          # Set exit node if configured
          if [ -n "$EXIT_NODE" ]; then
            echo "Setting exit node to: $EXIT_NODE"
            sudo tailscale set --exit-node="$EXIT_NODE"
          fi

          # Verify connection
          echo "Tailscale status:"
          tailscale status
          echo ""
          echo "Current public IP:"
          curl -s ifconfig.me || curl -s icanhazip.com

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg inotify-tools curl jq netcat-openbsd
          
      - name: Verify ffmpeg RTSP support
        run: |
          echo "Checking ffmpeg version and protocols:"
          ffmpeg -version
          echo "Supported protocols:"
          ffmpeg -protocols 2>/dev/null | grep rtsp || echo "RTSP not found in protocols"

      - name: Setup TeraBox credentials
        run: |
          echo "TeraBox configuration loaded from secrets"
          echo "MUNFAQQIHA method credentials:"
          echo "  TERABOX_JSTOKEN is set: ${{ secrets.TERABOX_JSTOKEN != '' }}"
          echo "  TERABOX_BDSTOKEN is set: ${{ secrets.TERABOX_BDSTOKEN != '' }} (optional but recommended)"
          echo "  TERABOX_COOKIE is set: ${{ secrets.TERABOX_COOKIE != '' }}"
          echo "Notification configuration:"
          echo "  DINGDING_WEBHOOK is set: ${{ secrets.DINGDING_WEBHOOK != '' }}"

      - name: Run recorder
        env:
          RTSP_URL: ${{ secrets.RTSP_URL }}
          # MUNFAQQIHA method credentials
          TERABOX_JSTOKEN: ${{ secrets.TERABOX_JSTOKEN }}
          TERABOX_BDSTOKEN: ${{ secrets.TERABOX_BDSTOKEN }}
          TERABOX_COOKIE: ${{ secrets.TERABOX_COOKIE }}
          TERABOX_REMOTE_FOLDER: ${{ vars.TERABOX_REMOTE_FOLDER || '/rtsp-videos' }}
          # DingTalk notification webhook
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        run: |
          chmod +x ./record.sh ./terabox_upload_simple.sh
          ./record.sh
