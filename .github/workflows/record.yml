name: record

on:
  workflow_dispatch:        # 手动触发
  schedule:
    # 北京时间 08:30 = UTC 00:30；14:30 = UTC 06:30
    - cron: "0 23 * * *"
    

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 最长录制 6 小时

    steps:
      - name: Show time
        run: date -u && date
        
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: github-recorder

      - name: Set exit node and verify routing
        env:
          EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
        run: |
          if [ -n "$EXIT_NODE" ]; then
            echo "🔧 Configuring Tailscale exit node: $EXIT_NODE"
            sudo tailscale set --exit-node="$EXIT_NODE" --accept-routes
            
            echo "⏳ Waiting for routes to propagate..."
            sleep 5
            
            echo "📡 Verifying Tailscale status:"
            tailscale status
            
            echo ""
            echo "🌍 Checking public IP (should be exit node IP):"
            curl -s https://api.ipify.org
            echo ""
            curl -s https://ifconfig.me
            echo ""
            
            echo "✅ Exit node configured. All traffic will use fixed IP."
          else
            echo "⚠️  WARNING: TAILSCALE_EXIT_NODE not set!"
            echo "Without exit node, GitHub Actions will use random IPs and TeraBox may block uploads."
            echo "Please set TAILSCALE_EXIT_NODE secret to fix IP address."
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg inotify-tools curl jq netcat-openbsd
          
      - name: Verify ffmpeg RTSP support
        run: |
          echo "Checking ffmpeg version and protocols:"
          ffmpeg -version
          echo "Supported protocols:"
          ffmpeg -protocols 2>/dev/null | grep rtsp || echo "RTSP not found in protocols"

      - name: Setup TeraBox credentials
        run: |
          echo "TeraBox configuration loaded from secrets"
          echo "MUNFAQQIHA method credentials:"
          echo "  TERABOX_JSTOKEN is set: ${{ secrets.TERABOX_JSTOKEN != '' }}"
          echo "  TERABOX_BDSTOKEN is set: ${{ secrets.TERABOX_BDSTOKEN != '' }} (optional but recommended)"
          echo "  TERABOX_COOKIE is set: ${{ secrets.TERABOX_COOKIE != '' }}"
          echo "Notification configuration:"
          echo "  DINGDING_WEBHOOK is set: ${{ secrets.DINGDING_WEBHOOK != '' }}"
          echo ""
          echo "🔍 Final IP verification before recording:"
          echo "Public IP that TeraBox will see:"
          curl -s https://api.ipify.org
          echo ""

      - name: Run recorder
        env:
          RTSP_URL: ${{ secrets.RTSP_URL }}
          # MUNFAQQIHA method credentials
          TERABOX_JSTOKEN: ${{ secrets.TERABOX_JSTOKEN }}
          TERABOX_BDSTOKEN: ${{ secrets.TERABOX_BDSTOKEN }}
          TERABOX_COOKIE: ${{ secrets.TERABOX_COOKIE }}
          TERABOX_REMOTE_FOLDER: ${{ vars.TERABOX_REMOTE_FOLDER || '/rtsp-videos' }}
          # DingTalk notification webhook
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        run: |
          chmod +x ./record.sh ./terabox_upload_simple.sh
          ./record.sh
